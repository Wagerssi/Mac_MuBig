name: Mac_MuBig_UI v2.4 빌드

on:
  push:
    branches: [ main ]          # main 브랜치에 push 할 때마다 자동 빌드
  workflow_dispatch:             # GitHub 웹사이트에서 수동 실행 버튼

jobs:
  build-macos:
    runs-on: macos-latest        # GitHub 의 무료 macOS 서버 사용

    steps:
      # 1. 저장소 코드 내려받기
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Python 3.11 설치
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 필요 패키지 설치
      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyside6 requests

      # 4. pyinstaller 로 macOS 앱 빌드 (--onedir → .app 번들 생성)
      - name: macOS 앱 빌드
        run: |
          pyinstaller \
            --noconfirm \
            --onedir \
            --windowed \
            --name "Mac_MuBig_UI v2.4" \
            --icon "asset/logo/Mubig.icns" \
            --add-data "asset:asset" \
            --add-data "MuBig_config.json:." \
            --hidden-import "PySide6.QtCore" \
            --hidden-import "PySide6.QtGui" \
            --hidden-import "PySide6.QtWidgets" \
            --hidden-import "PySide6.QtNetwork" \
            --hidden-import "requests" \
            --hidden-import "src" \
            --hidden-import "src.auth" \
            --hidden-import "src.installer" \
            --hidden-import "src.settings" \
            --hidden-import "src.ui" \
            --hidden-import "src.ui.main_window" \
            --hidden-import "src.ui.install_tab" \
            --hidden-import "src.ui.settings_tab" \
            --hidden-import "src.ui.custom_widgets" \
            --hidden-import "src.ui.styles" \
            --hidden-import "src.ui.wtf_file_dialog" \
            --hidden-import "src.utils" \
            --hidden-import "src.utils.file_handler" \
            --hidden-import "src.utils.game_paths" \
            main.py

      # 5. 결과물 압축 (.app 번들째로 압축)
      - name: 결과물 압축
        run: |
          cd dist
          zip -r "Mac_MuBig_UI_v2.4.zip" "Mac_MuBig_UI v2.4.app"

      # 6. 다운로드 가능하도록 업로드 (90일 보관)
      - name: Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Mac_MuBig_UI_v2.4
          path: dist/Mac_MuBig_UI_v2.4.zip
          retention-days: 90
